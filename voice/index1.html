<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legal AI Adviser | Voice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-color: #0a0a0c;
        --container-bg: rgba(255, 255, 255, 0.03);
        --border-color: rgba(255, 255, 255, 0.1);
        --accent-color: #3b82f6;
        --accent-hover: #2563eb;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --glass-blur: blur(12px);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-primary);
        font-family: "Inter", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        background-image:
          radial-gradient(
            circle at 20% 20%,
            rgba(59, 130, 246, 0.05) 0%,
            transparent 40%
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(59, 130, 246, 0.05) 0%,
            transparent 40%
          );
      }

      .container {
        width: 100%;
        max-width: 600px;
        background: var(--container-bg);
        backdrop-filter: var(--glass-blur);
        border: 1px solid var(--border-color);
        border-radius: 24px;
        padding: 40px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }

      header {
        margin-bottom: 32px;
        text-align: center;
      }

      h1 {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin-bottom: 8px;
        background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      p.subtitle {
        color: var(--text-secondary);
        font-size: 14px;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      textarea {
        width: 100%;
        min-height: 120px;
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 16px;
        color: var(--text-primary);
        font-family: inherit;
        font-size: 16px;
        line-height: 1.5;
        resize: vertical;
        transition: all 0.2s ease;
        outline: none;
      }

      textarea:focus {
        border-color: var(--accent-color);
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
      }

      button {
        background: var(--accent-color);
        color: white;
        border: none;
        padding: 14px 24px;
        border-radius: 12px;
        font-weight: 500;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      button:hover {
        background: var(--accent-hover);
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .status-row {
        margin-top: 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        background: rgba(255, 255, 255, 0.02);
        border-radius: 12px;
        border: 1px solid var(--border-color);
      }

      #latency {
        font-family: "Inter", monospace;
        font-size: 12px;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .status-badge {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--text-secondary);
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4ade80; /* online */
      }

      .dot.offline {
        background: #f87171;
      }
      .dot.busy {
        background: #fbbf24;
      }

      .transcription-area {
        margin-top: 24px;
        min-height: 60px;
        max-height: 150px;
        overflow-y: auto;
        background: rgba(0, 0, 0, 0.15);
        border-radius: 12px;
        padding: 16px;
        border-left: 2px solid var(--accent-color);
        line-height: 1.6;
        font-size: 15px;
        color: var(--text-primary);
        display: none; /* Hidden until content arrives */
      }

      .transcription-area.active {
        display: block;
      }

      /* Animation for loading/waiting */
      @keyframes pulse {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
        100% {
          opacity: 1;
        }
      }
      .waiting {
        animation: pulse 1.5s infinite ease-in-out;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Legal AI Adviser</h1>
        <p class="subtitle">
          Voice-enabled intelligence for your legal inquiries.
        </p>
      </header>

      <div id="transcription" class="transcription-area"></div>

      <div class="input-group">
        <textarea
          id="prompt"
          placeholder="Describe your legal situation or ask a question..."
        ></textarea>
        <button id="btn">
          <span>Ask Question</span>
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" y1="19" x2="12" y2="22" />
          </svg>
        </button>
      </div>

      <div class="status-row">
        <div class="status-badge">
          <div id="status-dot" class="dot"></div>
          <span id="status-text">Connecting...</span>
        </div>
        <div id="latency">No active request</div>
      </div>
    </div>

    <script>
      (() => {
        const socket = new WebSocket("ws://localhost:3001");
        const btn = document.getElementById("btn");
        const statusText = document.getElementById("status-text");
        const statusDot = document.getElementById("status-dot");
        const latencyEl = document.getElementById("latency");
        const promptEl = document.getElementById("prompt");
        const txEl = document.getElementById("transcription");

        let sampleRate = 48000;
        let audioCtx = null;
        let nextStartTime = 0;
        let promptSentTime = 0;
        let waitingForFirstByte = false;

        socket.binaryType = "arraybuffer";

        socket.onopen = () => {
          console.log("Connected");
          statusText.innerText = "Ready";
        };

        socket.onclose = () => {
          statusText.innerText = "Offline";
          statusDot.classList.add("offline");
          btn.disabled = true;
        };

        socket.onerror = () => {
          statusText.innerText = "Error";
          statusDot.classList.add("offline");
        };

        socket.onmessage = (event) => {
          // console.log("data", event.data);
          console.log("Chunk byteLength:", event.data.byteLength);

          if (event.data instanceof ArrayBuffer) {
            if (waitingForFirstByte) {
              const latency = (performance.now() - promptSentTime).toFixed(1);
              latencyEl.innerText = `TTFB: ${latency}ms`;
              latencyEl.classList.remove("waiting");
              waitingForFirstByte = false;
            }
            schedulePlayback(event.data);
            return;
          }

          if (typeof event.data === "string") {
            if (event.data === "INTERRUPT") {
              console.log("Interruption signal received from server");
              if (audioCtx) {
                audioCtx.close();
                audioCtx = null;
              }
              nextStartTime = 0;
              txEl.innerText = "";
              txEl.classList.remove("active");
              statusText.innerText = "Interrupted...";
              return;
            }

            if (event.data.startsWith("TEXT:")) {
              const delta = event.data.substring(5);
              txEl.classList.add("active");
              txEl.innerText += delta;
              txEl.scrollTop = txEl.scrollHeight;
              return;
            }

            if (event.data.startsWith("READY")) {
              const rate = parseInt(event.data.split(":")[1], 10);
              if (!isNaN(rate)) sampleRate = rate;
              statusText.innerText = "Online";
              return;
            }

            if (event.data === "DONE") {
              console.log("Audio stream end");
              statusText.innerText = "Online";
              statusDot.classList.remove("busy");
              btn.disabled = false;
              return;
            }

            if (event.data.startsWith("ERROR:")) {
              console.error(event.data);
              statusText.innerText = "Error";
              statusDot.classList.add("offline");
              btn.disabled = false;
            }
          }
        };

        function schedulePlayback(arrayBuffer) {
          if (!audioCtx) {
            audioCtx = new AudioContext();
            nextStartTime = audioCtx.currentTime;
          }

          const int16 = new Int16Array(arrayBuffer);
          const float32 = new Float32Array(int16.length);

          for (let i = 0; i < int16.length; i++) {
            float32[i] = int16[i] / 32768;
          }

          // Apply tiny fade in/out (5ms)
          const fadeSamples = Math.min(240, float32.length / 2); // ~5ms at 48k
          for (let i = 0; i < fadeSamples; i++) {
            float32[i] *= i / fadeSamples;
            float32[float32.length - 1 - i] *= i / fadeSamples;
          }

          const buffer = audioCtx.createBuffer(
            1,
            float32.length,
            audioCtx.sampleRate,
          );

          buffer.copyToChannel(float32, 0);

          const source = audioCtx.createBufferSource();
          source.buffer = buffer;
          source.connect(audioCtx.destination);

          const currentTime = audioCtx.currentTime;
          if (nextStartTime < currentTime) {
            nextStartTime = currentTime;
          }

          source.start(nextStartTime);
          nextStartTime += buffer.duration;
        }

        btn.onclick = () => {
          const text = promptEl.value.trim();
          if (text && socket.readyState === WebSocket.OPEN) {
            if (audioCtx && audioCtx.state === "suspended") {
              audioCtx.resume();
            }

            promptSentTime = performance.now();
            waitingForFirstByte = true;

            latencyEl.innerText = "Gemini is thinking...";
            latencyEl.classList.add("waiting");

            statusText.innerText = "Processing...";
            statusDot.classList.add("busy");
            btn.disabled = true;

            txEl.innerText = "";
            txEl.classList.remove("active");

            socket.send(text);
            promptEl.value = "";
          }
        };
      })();
    </script>
  </body>
</html>
